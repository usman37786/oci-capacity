name: OCI A1 launch
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: oci-launch
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
      SUPPRESS_LABEL_WARNING: "True"
      TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      AD: ${{ secrets.OCI_AD }}
      SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
      IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install OCI CLI
        run: pip install oci-cli

      - name: Write OCI config
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_PRIVATE_KEY" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=%s\nkey_file=%s\n' "$OCI_USER_OCID" "$OCI_FINGERPRINT" "$TENANCY" "$OCI_REGION" "$HOME/.oci/key.pem" > ~/.oci/config

      - name: Launch if no A1 server exists
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          COUNT=$(oci compute instance list --compartment-id "$TENANCY" --query "data[?shape=='VM.Standard.A1.Flex' && \"lifecycle-state\"!='TERMINATED'] | length(@)" --raw-output)
          if [ "$COUNT" -gt 0 ]; then
            echo "An A1 server already exists. Disabling this workflow."
            gh workflow disable oci-launch.yml --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          echo "$SSH_PUBLIC_KEY" > /tmp/key.pub
          set +e
          OUT=$(oci compute instance launch \
            --compartment-id "$TENANCY" \
            --availability-domain "$AD" \
            --shape VM.Standard.A1.Flex \
            --shape-config '{"ocpus":1,"memoryInGbs":6}' \
            --display-name n8n-server \
            --image-id "$IMAGE_ID" \
            --subnet-id "$SUBNET_ID" \
            --ssh-authorized-keys-file /tmp/key.pub \
            --boot-volume-size-in-gbs 50 \
            --assign-public-ip true 2>&1)
          if echo "$OUT" | grep -qiE "out of (host )?capacity|TooManyRequests"; then
            echo "No capacity right now. Will retry on the next run."
          elif echo "$OUT" | grep -q '"lifecycle-state"'; then
            echo "SUCCESS - server created."
            gh workflow disable oci-launch.yml --repo "$GITHUB_REPOSITORY"
          else
            echo "Unexpected error (details trimmed):"
            echo "$OUT" | grep -iE '"(code|message)"' || echo "$OUT" | head -c 300
            exit 1
          fi
